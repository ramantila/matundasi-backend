spring.application.name=matundasi
server.port=8065

# Database Configuration

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/db_matundasi
spring.datasource.username=postgres
spring.datasource.password=omarintila
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update = create missing tables/columns on startup, never drops data (dev only; use Flyway for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Security / JWT
# Signing key for login tokens (Base64, at least 32 bytes). Override with APP_JWT_SECRET outside local dev.
app.jwt.secret=${APP_JWT_SECRET:0nxqFRUWI8yp3Nl+HW70FnuH5/nyj/WvySnodKVozOguiFccwgDwptMYAoMP0jalCOI1VHMx9QIkoFRwWqpUyA==}
# Token lifetime in milliseconds (5 minutes)
app.jwt.expiration-ms=300000
# Refresh token lifetime in milliseconds (7 days); the frontend swaps it for a new token pair when the access token expires
app.jwt.refresh-expiration-ms=604800000
# false = every endpoint stays open (tokens are read when sent); true = every endpoint except login and Swagger needs a valid token
app.security.require-auth=false

# Startup seeder: creates missing permissions, the default branch, the Super Admin role and the admin user
app.seed.enabled=true
app.seed.branch-name=Head Office
app.seed.role-name=Super Admin
app.seed.admin.username=admin
app.seed.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}
app.seed.admin.first-name=System
app.seed.admin.last-name=Administrator
app.seed.admin.phone=+255700000000
